<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bibai Craft 発表メモ</title>
<style>
:root{--bg:#f7f5f1;--panel:#ffffff;--ink:#1c1b19;--sub:#5d5a54;--line:#d9d4cb;--accent:#a63b2a;--ok:#2f6b3a;--warn:#b07400}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141311;--panel:#1d1c1a;--ink:#f1eee8;--sub:#a7a29a;--line:#36332f;--accent:#e2735f;--ok:#7cc08a;--warn:#e0b24a}}
:root[data-theme="dark"]{--bg:#141311;--panel:#1d1c1a;--ink:#f1eee8;--sub:#a7a29a;--line:#36332f;--accent:#e2735f;--ok:#7cc08a;--warn:#e0b24a}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:grid;grid-template-rows:auto 1fr auto;height:100dvh}
header,footer{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
footer{border-top:1px solid var(--line);border-bottom:0;flex-wrap:wrap}
.count{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.title{font-size:22px;font-weight:750;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.range{font-size:18px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
main{overflow:auto;padding:24px clamp(16px,3vw,40px);display:grid;grid-template-columns:minmax(260px,38%) 1fr;gap:clamp(16px,3vw,40px);align-items:start}
aside{display:flex;flex-direction:column;gap:14px;position:sticky;top:0}
aside figure{margin:0}aside img{display:block;width:100%;aspect-ratio:1600/842;object-fit:cover;border:1px solid var(--line);border-radius:6px;background:#fff}
aside figcaption{font-size:14px;color:var(--sub);margin-top:6px;font-weight:650}
#nextfig{width:62%;opacity:.85}
body.listmode main{display:block}body.listmode aside{display:none}
#list section{display:grid;grid-template-columns:220px 1fr;gap:18px;cursor:pointer}#list section img{width:100%;border:1px solid var(--line);border-radius:4px}
@media (max-width:760px){main{grid-template-columns:1fr}aside{position:static;flex-direction:row}aside figure{flex:1}#nextfig{width:auto}#list section{grid-template-columns:1fr}}
#cur h3{font-size:20px;color:var(--sub);margin:0 0 14px;font-weight:700}
#cur p{font-size:clamp(22px,2.6vw,34px);line-height:1.75;margin:0;font-weight:600}
#cur p b{color:var(--accent)}
#cur small{display:block;margin-top:24px;font-size:17px;line-height:1.7;color:var(--sub)}
#cur a,#list a{color:inherit}
.next{font-size:17px;color:var(--sub);flex:1;min-width:200px}
.next b{color:var(--ink)}
.timer{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;min-width:4.2em;text-align:right}
.timer.late{color:var(--accent)}.timer.ahead{color:var(--ok)}
.pace{font-size:15px;color:var(--sub);min-width:7em}
button{font:inherit;font-size:16px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{background:var(--bg)}
#list{display:none}
body.listmode #cur{display:none}body.listmode #list{display:block}
#list section{border-bottom:1px solid var(--line);padding:18px 0}
#list h2{font-size:18px;margin:0 0 6px;color:var(--sub)}
#list h3{font-size:16px;margin:0 0 8px;color:var(--sub);font-weight:650}
#list p{font-size:19px;line-height:1.7;margin:0}
#list small{display:block;margin-top:8px;font-size:14px;color:var(--sub);line-height:1.6}
#list section.on{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.keys{font-size:13px;color:var(--sub);width:100%}
@media (max-width:600px){header{flex-wrap:wrap}.title{white-space:normal}.timer{font-size:28px}}
</style></head><body>

let i=0,running=false,startedAt=0,elapsed=0;
const $=id=>document.getElementById(id);
const fmt=t=>{t=Math.max(0,Math.floor(t));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
function render(){
 const s=SLIDES[i];
 $('count').textContent=(i+1)+' / '+SLIDES.length;
 $('title').textContent=s.label;
 $('range').textContent=s.start!=null?fmt(s.start)+'–'+fmt(s.end):'';
 $('cur').innerHTML='<h3>'+s.head+'</h3>'+s.body;
 $('curimg').src=s.thumb;$('curimg').alt=s.label;
 const nx=SLIDES[i+1];$('nextfig').hidden=!nx;if(nx){$('nextimg').src=nx.thumb;$('nextimg').alt=nx.label}
 const n=SLIDES[i+1];
 $('next').innerHTML=n?'次：<b></b>':'最後のスライド';
 if(n)$('next').querySelector('b').textContent=n.label;
 document.querySelectorAll('#list section').forEach((el,k)=>el.classList.toggle('on',k===i));
 $('prev').disabled=i===0;$('fwd').disabled=i===SLIDES.length-1;
 tick();
}
function go(k){i=Math.max(0,Math.min(SLIDES.length-1,k));render();document.querySelector('main').scrollTop=0}
function now(){return running?elapsed+(Date.now()-startedAt)/1000:elapsed}
function tick(){
 const t=now(),s=SLIDES[i],el=$('timer');
 el.textContent=fmt(t);el.classList.remove('late','ahead');$('pace').textContent='';
 if(s.end!=null&&(running||t>0)){
  if(t>s.end){el.classList.add('late');$('pace').textContent='予定より '+fmt(t-s.end)+' 遅れ'}
  else if(t<s.start){el.classList.add('ahead');$('pace').textContent='予定より '+fmt(s.start-t)+' 早い'}
  else $('pace').textContent='予定どおり';
 }
}
function toggle(){if(running){elapsed=now();running=false}else{startedAt=Date.now();running=true}$('start').textContent=running?'一時停止':'スタート'}
function reset(){running=false;elapsed=0;$('start').textContent='スタート';tick()}
function mode(){document.body.classList.toggle('listmode');$('mode').textContent=document.body.classList.contains('listmode')?'1枚表示':'一覧'}
$('list').innerHTML=SLIDES.map((s,k)=>'<section><img src="'+s.thumb+'" alt=""><div><h2>'+(k+1)+'. </h2><h3>'+s.head+'</h3>'+s.body+'</div></section>').join('');
document.querySelectorAll('#list h2').forEach((h,k)=>h.append(SLIDES[k].label));
document.querySelectorAll('#list section').forEach((el,k)=>el.addEventListener('click',e=>{if(e.target.closest('a'))return;go(k);mode()}));
$('start').onclick=toggle;$('reset').onclick=reset;$('prev').onclick=()=>go(i-1);$('fwd').onclick=()=>go(i+1);$('mode').onclick=mode;
document.addEventListener('keydown',e=>{
 if(e.altKey||e.ctrlKey||e.metaKey)return;
 const k=e.key;
 if(k==='ArrowRight'||k==='PageDown'){e.preventDefault();go(i+1)}
 else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();go(i-1)}
 else if(k.toLowerCase()==='s'){e.preventDefault();toggle()}
 else if(k.toLowerCase()==='r'){e.preventDefault();reset()}
 else if(k.toLowerCase()==='l'){e.preventDefault();mode()}
});
setInterval(tick,250);render();
</script></body></html>
